# Layer 1 — Nginx edge rate limiting (production)
#
# Place in your reverse proxy (e.g. /etc/nginx/conf.d/lancehive.conf).
# Tune via env: NGINX_RATE_LIMIT_RPS (default 50), NGINX_RATE_LIMIT_BURST (default 100).
#
# Production TLS: terminate HTTPS on port 443, redirect HTTP→HTTPS, and set
# proxy_set_header X-Forwarded-Proto $scheme so Laravel trustProxies and HSTS work.
# See deployment/README.md for the full VPS checklist.
# Laravel Sail local dev uses `artisan serve` without Nginx; Layer 2 Redis limits
# still apply via Laravel middleware. Use this config in staging/production.

limit_req_zone $binary_remote_addr zone=lancehive_api_per_ip:20m rate=50r/s;
limit_req_status 429;

upstream lancehive_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    location /api/ {
        limit_req zone=lancehive_api_per_ip burst=100 nodelay;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_pass http://lancehive_app;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://lancehive_app;
    }
}
